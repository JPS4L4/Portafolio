<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark light" />
<!-- Tema: se resuelve antes del primer pintado para evitar el parpadeo -->
<script>
(function () {
    var root = document.documentElement, theme = null;
    try { theme = localStorage.getItem('theme'); } catch (e) {}
    var forced = /[?&]theme=(light|dark)/.exec(window.location.search);
    if (forced) { theme = forced[1]; }
    if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    root.setAttribute('data-theme', theme);
    root.classList.add('js');
})();
</script>
<!-- ── SEO básico ── -->
<title>Juan Pablo Salazar | Desarrollador Full Stack y Editor de Video</title>
<meta name="description"
